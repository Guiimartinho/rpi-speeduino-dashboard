# Speeduino UI System Configuration

# CAN Bus settings
can:
  interface: can0
  bitrate: 500000
  protocol: haltech  # Options: haltech, bmw, vag
  timeout_ms: 500

# ZeroMQ IPC settings
zmq:
  publish_rate_hz: 50  # Engine data publish rate

# Reverse camera settings
camera:
  device: /dev/video0
  width: 640
  height: 480
  fps: 30

# OpenAuto settings
openauto:
  path: /usr/local/bin/openauto

# Reverse gear detection
# Options:
#   detection_mode: "can"           - CAN bus only (modern ECUs)
#   detection_mode: "gpio"          - GPIO only (classic cars like Gol Quadrado)
#   detection_mode: "both"          - Try CAN first, GPIO as fallback
#   detection_mode: "speeduino_can" - Speeduino CAN broadcast
#
#   preset: "gol_quadrado"          - VW Gol Quadrado / Fusca / Kombi
#   preset: "classic_vw"            - Same as gol_quadrado
#   preset: "speeduino_can"         - Speeduino with CAN enabled
#   preset: "haltech"               - Haltech ECU
#
reverse:
  detection_mode: both    # Primary detection method
  # preset: haltech       # Uncomment to use preset (sets all values below)

  # CAN-based detection (for modern ECUs)
  can_enabled: true
  can_id: 0x370      # Haltech VSS frame
  byte_index: 3       # Gear byte
  bit_mask: 0xFF      # Full byte
  expected_value: 0x00  # Gear 0 = reverse (adjust for your setup)

  # GPIO detection (for classic cars without CAN)
  # Connects to reverse lamp signal via optocoupler
  # See docs/WIRING_GOL_QUADRADO.md for wiring diagram
  gpio_enabled: false
  gpio_chip: gpiochip0
  gpio_line: 17       # GPIO17 (pin 11)
  gpio_active_low: false

  # Debounce time - filters noise from gear lever switch
  # Classic cars may need higher values (100-200ms)
  debounce_ms: 100

# Allowed CAN commands (whitelist)
# Only these CAN IDs can be sent from the UI
allowed_commands:
  - id: 0x7DF
    rate_limit: 10    # Max 10 requests/second
    description: "OBD-II broadcast request"

  - id: 0x7E0
    rate_limit: 5
    description: "ECU-specific OBD-II request"

# Display settings
display:
  width: 800
  height: 480
  fullscreen: true
  hide_cursor: true

# Logging
logging:
  level: info         # trace, debug, info, warn, error
  to_journald: true
