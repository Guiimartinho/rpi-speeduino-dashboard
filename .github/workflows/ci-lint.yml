# =============================================================================
# CI Lint - Fast Quality Checks (GitHub-hosted)
# =============================================================================
# Runs on ALL branches and PRs - fast feedback without hardware
# ~2-3 minutes on GitHub-hosted runners
# =============================================================================

name: CI Lint

on:
  push:
    branches:
      - '**'  # All branches
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPPCHECK_VERSION: "2.13"

jobs:
  # ===========================================================================
  # Format & Style Check
  # ===========================================================================
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trailing whitespace
        run: |
          echo "Checking for trailing whitespace..."
          if grep -r --include="*.cpp" --include="*.hpp" --include="*.h" --include="*.c" \
                     --include="*.qml" --include="*.sh" --include="*.py" \
                     '[[:space:]]$' .; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi
          echo "No trailing whitespace found"

      - name: Check line endings (LF)
        run: |
          echo "Checking for CRLF line endings..."
          if find . -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \
                              -o -name "*.qml" -o -name "*.sh" -o -name "*.py" \
                              -o -name "*.yaml" -o -name "*.yml" \) \
                    -exec file {} \; | grep -q CRLF; then
            echo "::error::CRLF line endings found. Use LF only."
            exit 1
          fi
          echo "All files use LF line endings"

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17

      - name: Check C++ formatting
        run: |
          echo "Checking C++ code formatting..."
          UNFORMATTED_FILES=""
          for file in $(find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h"); do
            if ! clang-format-17 --style=file --dry-run --Werror "$file" 2>/dev/null; then
              UNFORMATTED_FILES="$UNFORMATTED_FILES $file"
            fi
          done
          if [ -n "$UNFORMATTED_FILES" ]; then
            echo "::error::Unformatted files found:$UNFORMATTED_FILES"
            echo "Run: clang-format -i <file> to fix"
            exit 1
          fi
          echo "All C++ files properly formatted"

  # ===========================================================================
  # Static Analysis
  # ===========================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          echo "Running cppcheck static analysis..."
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=useStlAlgorithm \
            --suppress=missingInclude \
            --suppress=unknownMacro \
            --suppress=syntaxError \
            --suppress=shadowFunction \
            --suppress=knownConditionTrueFalse \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: [{severity}] {message} ({id})' \
            -D "Q_OBJECT=" \
            -D "Q_PROPERTY(x)=" \
            -D "Q_INVOKABLE=" \
            -D "Q_UNUSED(x)=(void)x" \
            -D "Q_EMIT=" \
            -D "Q_SIGNAL=" \
            -D "Q_SLOT=" \
            -D "slots=" \
            -D "signals=protected" \
            -D "emit=" \
            -I src/common/include \
            -I src/can_service/include \
            -I src/reverse_service/include \
            -I src/hmi_launcher/include \
            src/

      - name: MISRA nesting check
        run: |
          echo "Checking MISRA 15.6 nesting depth..."
          python3 .hooks/check-nesting.py $(find src -name "*.cpp" -o -name "*.hpp")

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          detect-secrets scan --baseline .secrets.baseline

      - name: Check for private keys
        run: |
          echo "Checking for private keys..."
          if grep -r --include="*.pem" --include="*.key" -l "PRIVATE KEY" . 2>/dev/null; then
            echo "::error::Private key files found in repository!"
            exit 1
          fi
          echo "No private keys found"

  # ===========================================================================
  # Linting
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install codespell PyYAML
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "Linting shell scripts..."
          shellcheck --severity=warning scripts/*.sh .hooks/*.sh || true

      - name: Spell check
        run: |
          echo "Checking spelling..."
          codespell --config .codespellrc \
                    --skip=".git,build,*.svg,*.png,*.jpg" \
                    src/ scripts/ configs/ || true

      - name: Validate YAML
        run: |
          echo "Validating YAML files..."
          python3 -c "
          import yaml
          import sys
          import glob

          errors = []
          for f in glob.glob('configs/*.yaml') + glob.glob('.github/**/*.yml', recursive=True):
              try:
                  with open(f) as fp:
                      yaml.safe_load(fp)
                  print(f'✓ {f}')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'✗ {f}: {e}')

          if errors:
              sys.exit(1)
          "

  # ===========================================================================
  # Python Tests (for test files)
  # ===========================================================================
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install black flake8 pytest

      - name: Check Python formatting
        run: |
          echo "Checking Python formatting..."
          black --check --diff tests/ || true

      - name: Lint Python
        run: |
          echo "Linting Python files..."
          flake8 tests/ --max-line-length=100 --ignore=E501,W503 || true

  # ===========================================================================
  # Summary
  # ===========================================================================
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [format-check, static-analysis, security, lint, python-check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.format-check.result }}" != "success" ] || \
             [ "${{ needs.static-analysis.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::One or more lint checks failed"
            exit 1
          fi
          echo "All lint checks passed!"
